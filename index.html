<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <meta name="description" content="Spaced is a calm home for your notes, projects, and ideas." />
    <title>Spaced — your second brain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/tweaks.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand-row">
          <button class="brand" id="brand-home" aria-label="Go to home"><span class="brand-mark">S</span><span>spaced</span></button>
          <button class="icon-button mobile-only" id="close-sidebar" aria-label="Close sidebar">×</button>
          <button class="icon-button sidebar-menu" id="workspace-menu" aria-label="Workspace menu">···</button>
        </div>
        <button class="workspace-switcher" id="workspace-switcher">
          <span class="workspace-avatar">S</span><span class="workspace-name">Personal workspace</span><span class="chevron">⌄</span>
        </button>
        <div class="sidebar-search-wrap"><span class="search-glyph">⌕</span><input id="sidebar-search" placeholder="Search anything" aria-label="Search workspace" /><kbd>⌘ K</kbd></div>
        <nav class="primary-nav" aria-label="Main navigation">
          <button class="nav-item" data-view="home"><span class="nav-icon">⌂</span>Home</button>
          <button class="nav-item" data-view="updates"><span class="nav-icon">◷</span>Updates</button>
          <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
        </nav>
        <div class="side-section">
          <div class="section-heading"><span>FAVORITES</span><button class="tiny-button" id="favorite-add" title="Add current page to favorites">+</button></div>
          <div id="favorites-list" class="page-list"></div>
        </div>
        <div class="side-section page-section">
          <div class="section-heading"><span>PRIVATE</span><button class="tiny-button" id="new-page" title="Create a page">+</button></div>
          <div id="page-tree" class="page-list tree-list"></div>
        </div>
        <div class="sidebar-bottom">
          <button class="nav-item ai-nav" id="open-assistant"><span class="ai-orb">✳</span>Ask Spaced<span class="beta-tag">LOCAL</span></button>
          <div class="profile-row"><div class="profile-avatar">T</div><div class="profile-copy"><strong>Tanishq Jain</strong><span>Free plan</span></div><button class="icon-button" id="theme-toggle" title="Toggle theme" aria-label="Toggle dark mode">◐</button></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumbs"><button class="icon-button mobile-only" id="open-sidebar" aria-label="Open sidebar">☰</button><button id="breadcrumb-home" class="breadcrumb-root">Personal workspace</button><span class="crumb-divider">/</span><span id="breadcrumb-current">Welcome to Spaced</span></div>
          <div class="top-actions"><span class="save-status" id="save-status"><i></i>Saved</span><button class="top-action" id="share-page" title="Copy a link to this page">↗ <span>Share</span></button><button class="top-action" id="page-menu" title="Page options">···</button></div>
        </header>
        <section class="workspace-content" id="workspace-content"></section>
      </main>

      <section class="assistant-panel" id="assistant-panel" aria-label="Spaced assistant" hidden>
        <header class="assistant-header"><div><span class="assistant-mark">✳</span><div><strong>Ask your workspace</strong><small>Private, local search</small></div></div><button class="icon-button" id="close-assistant" aria-label="Close assistant">×</button></header>
        <div class="assistant-disclaimer"><span>◎</span><p>Answers are found in your saved pages and text files. No AI service is connected yet.</p></div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="assistant-suggestions"><button data-prompt="Summarize the current page">Summarize page</button><button data-prompt="What action items are in my notes?">Find action items</button></div>
        <form class="chat-form" id="chat-form"><textarea id="chat-input" rows="1" placeholder="Ask about your workspace…" aria-label="Ask about your workspace"></textarea><button type="submit" aria-label="Send message">↑</button></form>
        <div class="chat-footnote">Spaced local assistant · No external model</div>
      </section>
    </div>

    <div class="search-overlay" id="search-overlay" hidden>
      <div class="search-dialog"><div class="search-input-row"><span>⌕</span><input id="global-search" placeholder="Search pages and documents…" autocomplete="off" /><kbd>ESC</kbd></div><div class="search-results" id="search-results"></div><div class="search-hint"><span>↑↓ to navigate</span><span>↵ to open</span></div></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="file-input" accept=".txt,.md,.pdf,text/plain,text/markdown,application/pdf" multiple hidden />
    <input type="file" id="image-input" accept="image/*" hidden />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
